name: Deploy Voxen Insights to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize site for custom domain
        shell: bash
        run: |
          find site -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' -o -name '*.css' -o -name '*.js' -o -name '*.svg' \) -print0 \
            | xargs -0 sed -i \
              -e 's#https://soonyeol-huh.github.io/auto_blog#https://insights.voxen.io#g' \
              -e 's#http://soonyeol-huh.github.io/auto_blog#https://insights.voxen.io#g' \
              -e 's#/auto_blog/#/#g'
          sed -i 's#https://insights.voxen.io/assets/ai-needs-company-data.svg#https://insights.voxen.io/assets/ai-needs-company-data-og.png#g' site/posts/why-ai-needs-company-data/index.html
          printf '%s\n' 'insights.voxen.io' > site/CNAME

      - name: Render social share PNG images
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-noto-cjk
          shopt -s nullglob
          for src in site/assets/*-og.svg; do
            out="${src%.svg}.png"
            rsvg-convert -w 1200 -h 630 "$src" -o "$out"
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
