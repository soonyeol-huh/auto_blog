name: Deploy Voxen Insights to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize site for custom domain
        shell: bash
        run: |
          find site -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' -o -name '*.css' -o -name '*.js' -o -name '*.svg' \) -print0 \
            | xargs -0 sed -i \
              -e 's#https://soonyeol-huh.github.io/auto_blog#https://insights.voxen.io#g' \
              -e 's#http://soonyeol-huh.github.io/auto_blog#https://insights.voxen.io#g' \
              -e 's#/auto_blog/#/#g'
          printf '%s\n' 'insights.voxen.io' > site/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
