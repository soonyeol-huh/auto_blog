<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f7f8fa"/><g font-family="'Noto Sans CJK KR','Noto Sans KR',sans-serif" fill="#20242a"><text x="70" y="90" font-size="25" font-weight="700">VOXEN INSIGHTS · DATA BUSINESS</text><text x="70" y="155" font-size="42" font-weight="800">외부 시장 데이터 + 사내 매출 데이터</text><text x="70" y="205" font-size="29">따로 보지 말고 하나의 의사결정 흐름으로 연결하세요</text><g fill="none" stroke="#3d4652" stroke-width="3"><rect x="70" y="280" width="220" height="150" rx="22"/><rect x="365" y="280" width="220" height="150" rx="22"/><rect x="660" y="280" width="220" height="150" rx="22"/><rect x="955" y="280" width="175" height="150" rx="22"/></g><g font-size="24" text-anchor="middle"><text x="180" y="325" font-weight="700">외부 시장 신호</text><text x="180" y="365" font-size="20">검색·가격·리뷰</text><text x="180" y="397" font-size="20">경쟁사·트렌드</text><text x="475" y="325" font-weight="700">사내 실적</text><text x="475" y="365" font-size="20">매출·재고·광고</text><text x="475" y="397" font-size="20">고객·상품</text><text x="770" y="325" font-weight="700">통합 데이터</text><text x="770" y="365" font-size="20">상품·기간 기준 정렬</text><text x="770" y="397" font-size="20">변화·상관 확인</text><text x="1042" y="325" font-weight="700">의사결정</text><text x="1042" y="365" font-size="20">가격·재고</text><text x="1042" y="397" font-size="20">마케팅</text></g><g font-size="38"><text x="315" y="370">→</text><text x="610" y="370">→</text><text x="905" y="370">→</text></g><text x="70" y="535" font-size="25" font-weight="700">핵심: AI가 답하기 전에 비교 가능한 데이터 기준을 먼저 만든다</text><text x="70" y="575" font-size="20">수집 → 정규화 → 내부 데이터 결합 → 변화 감지 → 대시보드·AI → 실행</text></g></svg>