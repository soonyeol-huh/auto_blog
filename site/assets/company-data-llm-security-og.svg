<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif}.t{fill:#f8fafc}.m{fill:#94a3b8}.box{fill:#172033;stroke:#334155;stroke-width:2}.line{stroke:#38bdf8;stroke-width:4;fill:none}.safe{fill:#0f766e}</style><rect width="1200" height="630" fill="#0b1120"/><text x="70" y="85" class="t" font-size="38" font-weight="700">사내 데이터 → LLM, 어디서 보안을 걸어야 할까?</text><text x="70" y="125" class="m" font-size="20">데이터 최소화 · 권한 · 승인 · 감사 로그를 연결 구조 안에 설계</text><rect x="70" y="210" width="220" height="210" rx="24" class="box"/><text x="180" y="260" text-anchor="middle" class="t" font-size="24" font-weight="700">회사 데이터</text><text x="180" y="310" text-anchor="middle" class="m" font-size="20">CRM · ERP</text><text x="180" y="345" text-anchor="middle" class="m" font-size="20">문서 · 메일</text><text x="180" y="380" text-anchor="middle" class="m" font-size="20">업무 시스템</text><path d="M290 315H390" class="line"/><rect x="390" y="180" width="300" height="270" rx="28" class="safe"/><text x="540" y="230" text-anchor="middle" class="t" font-size="25" font-weight="700">보안 게이트</text><text x="430" y="285" class="t" font-size="19">✓ 필요한 데이터만</text><text x="430" y="325" class="t" font-size="19">✓ 사용자별 최소 권한</text><text x="430" y="365" class="t" font-size="19">✓ 중요 실행은 사람 승인</text><text x="430" y="405" class="t" font-size="19">✓ 모든 실행은 감사 로그</text><path d="M690 315H790" class="line"/><rect x="790" y="210" width="340" height="210" rx="24" class="box"/><text x="960" y="265" text-anchor="middle" class="t" font-size="26" font-weight="700">LLM + 업무 실행</text><text x="960" y="315" text-anchor="middle" class="m" font-size="20">검색 · 요약 · 추천</text><text x="960" y="350" text-anchor="middle" class="m" font-size="20">API 호출 · 자동화</text><text x="960" y="385" text-anchor="middle" class="m" font-size="20">승인 후 시스템 반영</text><rect x="70" y="500" width="1060" height="72" rx="18" fill="#111827"/><text x="600" y="545" text-anchor="middle" class="t" font-size="21">핵심: AI에 모든 권한을 주는 것이 아니라, 업무에 필요한 만큼만 연결합니다.</text></svg>